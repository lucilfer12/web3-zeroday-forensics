name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m tools.zdf validate
      - run: python -m tools.zdf report
      - run: python -m tools.research audit
      - run: python -m tools.research report
      - run: python -m tools.triage report
      - run: python tools/build_site.py
      - run: git diff --exit-code
      - run: pytest -q
